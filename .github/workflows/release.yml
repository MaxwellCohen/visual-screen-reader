name: Release

# Builds the extension and publishes a zip you can "Load unpacked" in Chrome.
# - Every push to main refreshes the rolling "latest" pre-release.
# - Pushing a tag like v0.1.0 creates a versioned release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Zip extension
        run: |
          cd dist
          zip -r ../visual-screen-reader.zip .

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" visual-screen-reader.zip \
            --title "Visual Screen Reader $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish rolling latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest visual-screen-reader.zip \
            --title "Latest build (main)" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip and use **Load unpacked** in chrome://extensions." \
            --prerelease \
            --target "$GITHUB_SHA"
